<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <title>salesUp Capture</title>
  <style>
    :root { --blue: #1a2540; --orange: #FF6B35; }
    * { box-sizing: border-box; font-family: -apple-system, 'Segoe UI', sans-serif; }
    body { margin: 0; background: var(--blue); color: #fff; padding: 28px; }
    h1 { font-size: 22px; text-align: center; margin: 8px 0 4px; }
    h1 span { color: var(--orange); }
    .sub { color: #aab2c5; font-size: 12px; text-align: center; margin-bottom: 20px; }
    label { display: block; color: #aab2c5; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; margin: 14px 0 6px; }
    input, select { width: 100%; padding: 10px 12px; border-radius: 8px; border: none; background: rgba(255,255,255,.08); color: #fff; font-size: 14px; }
    select option { color: #1a2540; }
    button { width: 100%; margin-top: 18px; padding: 13px; border: none; border-radius: 10px; background: var(--orange); color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .45; cursor: default; }
    button.stop { background: #d83a3a; }
    .consent { display: flex; gap: 10px; align-items: flex-start; margin-top: 18px; font-size: 12.5px; color: #cfd5e1; line-height: 1.45; }
    .consent input { width: auto; margin-top: 2px; }
    #timer { font-size: 48px; font-weight: 200; text-align: center; margin: 18px 0 4px; font-variant-numeric: tabular-nums; display: none; }
    .msg { margin-top: 14px; font-size: 12.5px; line-height: 1.45; text-align: center; }
    .msg.err { color: #ff9d8f; } .msg.ok { color: #8fd9a8; } .msg.hint { color: #ffd9a8; }
    .foot { margin-top: 22px; text-align: center; }
    .foot a { color: #8a93a6; font-size: 12px; }
    #recView, #mainView, #loginView { display: none; }
  </style>
</head>
<body>
  <h1>sales<span>Up</span> Capture</h1>
  <p class="sub">Botloze meeting-opname — draait op de achtergrond, nooit ín je meeting</p>

  <div id="loginView">
    <label>E-mailadres</label>
    <input id="email" type="email" autocomplete="username" />
    <label>Wachtwoord</label>
    <input id="password" type="password" autocomplete="current-password" />
    <button id="loginBtn">Inloggen</button>
    <p id="loginMsg" class="msg err"></p>
  </div>

  <div id="mainView">
    <p id="hint" class="msg hint"></p>
    <div id="clientWrap">
      <label>Klant</label>
      <select id="client"></select>
    </div>
    <label>Titel (optioneel)</label>
    <input id="title" placeholder="bv. Demo-gesprek Acme NV" />
    <div class="consent">
      <input id="consent" type="checkbox" />
      <span>De gesprekspartner(s) zijn geïnformeerd dat dit gesprek wordt opgenomen voor kwaliteits- en trainingsdoeleinden.</span>
    </div>
    <button id="startBtn">● Start opname</button>
    <p id="mainMsg" class="msg"></p>
    <div class="foot"><a href="#" id="logout">Uitloggen</a></div>
  </div>

  <div id="recView">
    <div id="timer">00:00</div>
    <p class="sub">Opname loopt — de app blijft in de menubalk actief.</p>
    <button id="stopBtn" class="stop">Stop &amp; verstuur</button>
    <p id="recMsg" class="msg"></p>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
